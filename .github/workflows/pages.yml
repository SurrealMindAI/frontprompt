name: pages

# Builds the marketing + docs site (site/) and deploys it to GitHub Pages at
# https://surrealmindai.github.io/frontprompt/. The site renders the repo's
# Markdown (README, ARCHITECTURE, docs/**, service READMEs) — the SSoT — so it
# rebuilds whenever that content, the site code, or the shared design tokens
# change.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '*.md'
      - 'frontend/src/lib/tokens/**'
      - 'frontend/src/lib/theme/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress release deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
