name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Sync Python deps
        run: uv sync --frozen

      - name: Install frontend deps
        run: cd frontend && bun install --frozen-lockfile

      - name: Lint + type-check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src

      - name: Build overlay bundle (codegen + vite + embed)
        run: uv run python -m frontprompt.build

      - name: Frontend tests
        run: cd frontend && bun run test

      - name: Install Chromium + system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          uv run python -m playwright install --with-deps chromium

      - name: Python tests (headful browser under xvfb)
        run: xvfb-run -a uv run pytest -v
