name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint + type-check + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - run: uv sync --frozen

      - name: Install frontend deps
        run: cd frontend && bun install --frozen-lockfile

      - name: Lint + type-check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src

      - name: Build overlay bundle (codegen + vite + embed)
        run: uv run python -m frontprompt.build

      - name: Frontend tests
        run: cd frontend && bun run test

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - run: uv sync --frozen

      - name: Install frontend deps
        run: cd frontend && bun install --frozen-lockfile

      - name: Build overlay bundle (codegen + vite + embed)
        run: uv run python -m frontprompt.build

      - name: Install Chromium + system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          uv run python -m playwright install --with-deps chromium

      - name: Python tests (real Chromium under xvfb)
        # Real-browser integration tests are inherently flaky under a virtual
        # display — a transient IPC drop mid-screenshot is an environment quirk,
        # not a code defect. Retry ONLY those transient classes; any other
        # (deterministic) failure still fails fast on the first run.
        run: >
          xvfb-run -a uv run pytest -v
          --reruns 2 --reruns-delay 2
          --only-rerun IpcConnectError
          --only-rerun "Server schloss connection"
          --only-rerun TimeoutError
