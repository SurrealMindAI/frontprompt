<!doctype html>
<html lang="en" data-fp-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>frontprompt overlay — visual harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* A neutral faux page behind the overlay so the HUD frame reads against
         realistic content (the overlay wraps the host page in its panel frame). */
      body {
        background: #0b0b12;
        color: #6b6b80;
        font: 14px system-ui, sans-serif;
      }
      .page {
        padding: 32px;
        max-width: 760px;
      }
      .page h1 {
        color: #9a9ab2;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Visual harness page</h1>
      <p>
        The real <code>&lt;fp-overlay&gt;</code> custom element mounts above this content with a
        deterministic cold-boot bridge stub. Playwright screenshots the overlay chrome for
        visual-regression and runs axe-core for accessibility. See <code>visual/README.md</code>.
      </p>
    </main>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
